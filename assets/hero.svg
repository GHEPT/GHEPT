<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B1A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>

  <text x="70" y="110"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="62"
        font-weight="700"
        fill="#FFFFFF">
    Eduardo Teodoro
  </text>

  <text x="70" y="170"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        fill="#CBD5E1">
    For me, building is about more than writing code.
  </text>

  <text x="70" y="205"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        fill="#CBD5E1">
    It's about turning ideas into reality, bringing clarity to complexity,
  </text>

  <text x="70" y="240"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="24"
        fill="#CBD5E1">
    and creating meaningful impact in people's lives.
  </text>

  <text x="70" y="315"
        font-family="Segoe UI, Arial,sans-serif"
        font-size="28"
        font-weight="700"
        fill="url(#accent)">
    Technical Founder at Teo Logic
  </text>

  <text x="70" y="355"
        font-family="Segoe UI, Arial,sans-serif"
        font-size="20"
        fill="#94A3B8">
    Building products that make a meaningful impact
  </text>

  <circle cx="1060" cy="170" r="105"
          fill="none"
          stroke="url(#accent)"
          stroke-width="5"/>

  <text x="1018" y="177"
        font-family="Segoe UI, Arial,sans-serif"
        font-size="20"
        fill="#94A3B8">
    YOUR PHOTO
  </text>
